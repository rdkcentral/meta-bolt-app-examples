BBPATH .= ":${LAYERDIR}"

BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-bolt-wayland-egl-test"
BBFILE_PATTERN_meta-bolt-wayland-egl-test = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-bolt-wayland-egl-test = "10"

LAYERDEPENDS_meta-bolt-wayland-egl-test = "bolt-base"
LAYERSERIES_COMPAT_meta-bolt-wayland-egl-test = "kirkstone"
